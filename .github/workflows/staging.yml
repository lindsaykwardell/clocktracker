name: Temporary staging

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [up, list, destroy, extend, cleanup]
        default: up
        required: true
      ref:
        description: Trusted branch or commit to deploy (must contain current staging controls)
        default: main
        required: true
      hours:
        description: Lifetime in whole hours, 1–168; for extend, hours from now
        default: '1'
        required: true
      environment_id:
        description: Environment ID for destroy or extend
        required: false
      backup:
        description: Barman backup ID or latest
        default: latest
        required: true
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

# Serializes lifecycle operations, not running environments. Avoids extend/cleanup races.
concurrency:
  group: staging-lifecycle
  cancel-in-progress: false

jobs:
  manage:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.STAGING_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment: staging-operations
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v5
        if: inputs.action == 'up'
        with:
          ref: ${{ inputs.ref }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: control/package-lock.json
      - name: Install trusted automation dependencies
        working-directory: control
        run: npm ci --ignore-scripts
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
        with:
          version: '0.4.123'
      - name: Manage environments
        working-directory: control
        env:
          STAGING_ENABLED: ${{ vars.STAGING_ENABLED }}
          STAGING_ACTION: ${{ inputs.action || 'cleanup' }}
          STAGING_HOURS: ${{ inputs.hours || '1' }}
          STAGING_ID: ${{ inputs.environment_id }}
          STAGING_BACKUP: ${{ inputs.backup || 'latest' }}
          STAGING_REF: ${{ inputs.ref }}
          STAGING_SOURCE_DIR: ${{ github.workspace }}/source
          STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
          STAGING_REGION: ${{ vars.STAGING_REGION }}
          STAGING_SOURCE_DATABASE_APP: ${{ secrets.STAGING_SOURCE_DATABASE_APP }}
          STAGING_DATABASE_NAME: ${{ secrets.STAGING_DATABASE_NAME }}
          STAGING_STATE_BUCKET: ${{ secrets.STAGING_STATE_BUCKET }}
          FLY_ORG: ${{ secrets.STAGING_FLY_ORG }}
          FLY_API_TOKEN: ${{ secrets.STAGING_FLY_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.STAGING_CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.STAGING_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STAGING_STATE_SECRET_ACCESS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scripts/staging/manage.mjs "$STAGING_ACTION"
